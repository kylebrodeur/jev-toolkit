name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (vitest, the runner package.json declares)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.5.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      # The anti-slop Oxlint rules at error, with the recorded no-runtime-typeof
      # overrides. Warnings do not fail the job (oxlint exits 0), which is the
      # state observed locally: find the command in package.json (lint:self).
      - name: Lint
        run: pnpm lint:self